<!DOCTYPE html>
<html>
    <head>
        <title>Item Management System</title>
    </head>
    <body>
        <h1>Item Management System</h1>
        <label>Item Name:</label>
        <input type="text" id="itemName"><br><br>
        <label>Quantity:</label>
        <input type="number" id="quantity"><br><br>
        <label>Price:</label>
        <input type="number" id="price"><br><br>
        <div id="formButtons">
            <button id="addBtn" onclick="addItem()">Add Item</button>
        </div>
        <p id="message"></p>
        <hr>
        <h2>Item Records</h2>
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>CTR</th>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
            <tfoot>
                <tr>
                    <td colspan="4" align="center"><b>Grand Total</b></td>
                    <td align="center"><b id="grandTotal">0</b></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>

        <script src="linked.js"></script>
    </body>
</html>
